name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend-cms/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend-cms/**"

defaults:
  run:
    working-directory: ./backend-cms

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend-cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
